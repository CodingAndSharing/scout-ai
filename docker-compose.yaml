# Scout-AI — container topology.
#
# The Dockerfile says how the image is built; this file says how it is run: which
# volumes carry state, which ports are published, and how the CLI reaches Ollama.
# Every service shares one image, so one build covers all of them.
#
#   docker compose build                                # builds scout-ai:local
#   docker compose run --rm cli llm ask "Hello"
#   docker compose --profile ollama up -d ollama        # key-free local models
#   docker compose --profile server up                  # browser UI on :4567
#   docker compose --profile test run --rm test         # offline unit suite
#   docker compose --profile dev run --rm dev llm ask -d -c chats/hello.chat
#
# NOTE: services behind a `profiles:` key are invisible to plain `docker compose
# build` / `up`. `cli` deliberately has no profile so that a bare
# `docker compose build` produces the shared image; the rest are opt-in.

# What Scout-AI reads from the environment. Names matter: it resolves
# <BACKEND>_KEY / <BACKEND>_URL / <BACKEND>_MODEL — OPENAI_API_KEY is read by
# nothing (README_dev §2.3.1, audit #21).
x-scout-env: &scout-env
  # Credentials
  OPENAI_KEY: ${OPENAI_KEY:-}
  ANTHROPIC_KEY: ${ANTHROPIC_KEY:-}
  OPENROUTER_KEY: ${OPENROUTER_KEY:-}
  HF_TOKEN: ${HF_TOKEN:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}   # the anthropic gem's own fallback
  # Which model answers, without touching any YAML. Set these in .env.
  LLM_BACKEND: ${LLM_BACKEND:-}               # ollama | openai | anthropic | …
  ASK_ENDPOINT: ${ASK_ENDPOINT:-}             # …or name an ~/.scout/etc/AI/<name>.yaml
  OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
  OLLAMA_MODEL: ${OLLAMA_MODEL:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-}
  ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}

x-scout-common: &scout-common
  build:
    context: .
  image: scout-ai:local
  # Everything in ./.env is injected into the container (Compose >= 2.24 for
  # `required: false`). .env is gitignored and dockerignored, so secrets stay
  # out of git and out of images.
  env_file:
    - path: .env
      required: false
  environment: *scout-env
  # Scout resolves ./chats from the working directory, and `llm server` serves
  # exactly ./chats — so both must sit where the host volume is mounted.
  working_dir: /work
  volumes:
    # The whole Scout state directory: endpoint YAMLs, saved chats, agent dirs,
    # workflow job caches, provenance. Drop this and every run starts from zero.
    - scout-state:/root/.scout
    # Chat files you edit on the host. `llm ask -c` appends the reply in place.
    - ./chats:/work/chats
  networks: [scout]

services:
  # One-shot CLI, and the service `docker compose build` builds. Anything after
  # the service name is appended to `scout-ai`.
  cli:
    <<: *scout-common

  # The Sinatra chat UI. It binds 127.0.0.1 by default, which is unreachable from
  # outside the container — SCOUT_BIND is what makes the published port work.
  server:
    <<: *scout-common
    profiles: ["server"]
    command: ["llm", "server"]
    environment:
      <<: *scout-env
      SCOUT_BIND: 0.0.0.0
      SCOUT_PORT: "4567"
    ports:
      - "${SCOUT_PORT:-4567}:4567"

  # Live source, no rebuild: the checkout is bind-mounted over /app while the conda
  # environment stays in /opt/env. Edit lib/ on the host, rerun, see the change.
  dev:
    <<: *scout-common
    profiles: ["dev"]
    working_dir: /app
    volumes:
      - scout-state:/root/.scout
      - ./:/app

  # Offline unit suite. No scout-state volume and a throwaway HOME on purpose:
  # a dirty ~/.scout produces false failures (README_dev §2.2.6 / audit #20).
  test:
    <<: *scout-common
    profiles: ["test"]
    entrypoint: ["pixi", "run", "--manifest-path", "/opt/env/pixi.toml", "rake", "test"]
    command: []
    working_dir: /app
    environment:
      HOME: /tmp/scout-test-home
    volumes:
      - ./:/app

  # Key-free local inference. Reachable from the other services as
  # http://ollama:11434 — no /v1 suffix, see README_dev audit #16. That URL is
  # already the default of OLLAMA_URL above.
  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    networks: [scout]

volumes:
  scout-state:
  ollama-models:

networks:
  scout:
